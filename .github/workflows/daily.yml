name: daily
# BodyQuest 3D cloud fallback — produces the daily Short when the PC didn't.
# Local PC (Task Scheduler 16:00) is the YouTube uploader of record; this run
# renders + hosts + commits state, and the local catch-up uploads it on next boot.

on:
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC — after the local daily window
  workflow_dispatch:
    inputs:
      force_test:
        description: "Full pipeline test with the throwaway render-test script (no state changes)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      produce: ${{ steps.check.outputs.produce }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ "${{ github.event.inputs.force_test }}" = "true" ]; then
            echo "produce=true" >> "$GITHUB_OUTPUT"
          else
            P=$(python3 runner/daily.py --covered >/dev/null 2>&1 && echo false || echo true)
            echo "produce=$P" >> "$GITHUB_OUTPUT"
          fi

  produce:
    needs: check
    if: needs.check.outputs.produce == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      FACELESS_HOME: /home/runner/bq-faceless   # same path for setup + produce (runner.home is /home/runner)
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup environment + models
        run: bash runner/setup.sh

      - name: Restore YouTube token (direct cloud upload)
        env:
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
        run: |
          if [ -n "$YT_TOKEN" ]; then printf '%s' "$YT_TOKEN" > token.json && echo "token restored (direct upload enabled)"; else echo "no YT_TOKEN secret; hosted-link fallback"; fi

      - name: Produce daily Short
        env:
          BQ_FORCE_TEST: ${{ github.event.inputs.force_test }}
        run: python3 runner/daily.py

      - name: Commit state
        if: env.BQ_FORCE_TEST != 'true'
        run: |
          git config user.name "bodyquest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state facts 2>/dev/null || true
          git diff --cached --quiet || git commit -m "cloud daily: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash origin master
          git push

      - name: Upload video artifact (30 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: cloud_projects/**/*.mp4
          if-no-files-found: ignore
