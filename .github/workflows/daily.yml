name: daily
# BodyQuest 3D — CLOUD PRODUCTION (user mandate 2026-11-16: all work in the cloud, 3 videos/day,
# scheduled evening publish slots 15:00/18:00/21:00 PKT).
# Three runs/day (07:30, 10:30, 13:30 UTC) so each render finishes before its same-day slot.
# Each run: quota check -> pick highest-score READY topic (facts + shots.js) -> voice/words/mix
# -> HQ render (res=1 aa=4 shadow=2048) -> QA -> upload via official API (private + publishAt
# next free slot) -> commit state. The LOCAL daily run is fallback/authoring only.

on:
  schedule:
    - cron: "30 7,10,13 * * *"
  workflow_dispatch:
    inputs:
      force_test:
        description: "Full pipeline test with the throwaway render-test script (no state changes)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      produce: ${{ steps.check.outputs.produce }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ "${{ github.event.inputs.force_test }}" = "true" ]; then
            echo "produce=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python3 runner/daily.py --covered
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            # quota already met today - nothing to do
            echo "produce=false" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 2 ]; then
            # queue is dry: fail loudly so this can never hide as a silent skip again
            echo "::error::NO READY TOPIC - author facts/<slug>.json AND facts/<slug>.shots.js for the next topics.yaml entry"
            exit 1
          else
            echo "produce=true" >> "$GITHUB_OUTPUT"
          fi

  produce:
    needs: check
    if: needs.check.outputs.produce == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      FACELESS_HOME: /home/runner/bq-faceless   # same path for setup + produce (runner.home is /home/runner)
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup environment + models
        run: bash runner/setup.sh

      - name: Restore YouTube token (direct cloud upload)
        env:
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
        run: |
          if [ -n "$YT_TOKEN" ]; then printf '%s' "$YT_TOKEN" > token.json && echo "token restored (direct upload enabled)"; else echo "no YT_TOKEN secret; hosted-link fallback"; fi

      - name: Produce daily Short
        env:
          BQ_FORCE_TEST: ${{ github.event.inputs.force_test }}
        run: python3 runner/daily.py

      - name: Commit state
        if: env.BQ_FORCE_TEST != 'true'
        run: |
          git config user.name "bodyquest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state facts 2>/dev/null || true
          git diff --cached --quiet || git commit -m "cloud daily: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash origin master
          git push

      - name: Upload video artifact (30 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: cloud_projects/**/*.mp4
          if-no-files-found: ignore
