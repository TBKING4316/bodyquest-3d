# Notification channels — BodyQuest 3D
# fired after every finished render/upload (private) and on pipeline errors
email:
  app: Email by Zapier (ZapierMailCLIAPI, action outbound)
  to: (state/private.yaml report_email - untracked)
  from_name: "BodyQuest 3D Autopilot"
  status: ACTIVE (test sent 2026-11-11, delivered)
  instant_alerts: ACTIVE (user mandate 2026-11-13) - the moment any error/problem/issue is faced, mail the report address from state/private.yaml IMMEDIATELY with subject starting "BodyQuest 3D ALERT:"; do not wait for the daily report; include the error, attempts made, and the fix plan; retry once if the email action itself fails
  applies_to: daily runs, cloud runs, and every interactive session
github_actions_failures:
  layer: second-line alert - GitHub emails failed-run notices to the account's the account owner email for owned/watched repos; best-effort (user setting, not verifiable from here)
  local_catchup: when the PC boots after a missed/offline window, run_daily.cmd uploads pending items; any failure there triggers the instant ALERT email per policy above
session_end_report:
  policy: ACTIVE (user mandate 2026-11-14) - BEFORE a session's limit can cut it, shift work first: finish or mark PENDING, commit+push, then email the report address from state/private.yaml with subject "BodyQuest 3D SESSION END" with what was done, what remains PENDING, and the watchdog ETA (<2h)
whatsapp:
  app: WhatsApp Notifications (WhatsAppNotificationsCLIAPI, action send_message)
  status: DEFERRED (user decision 2026-11-12: no phone yet; will add after YouTube earnings buy one, or via a borrowed phone on request)
  auth_url: https://mcp.zapier.com/api/v1/connect-auth/WhatsAppNotificationsCLIAPI?accountId=29202534
  note: template "message_reminder" (New Message) fits our use; template param required by Meta policy
publish_time: "18:00 PKT"   # confirmed by user 2026-11-12; scheduled task fires 16:00 so video is ready for review
cloud_fallback: github_actions   # user choice 2026-11-12; repo TBKING4316/bodyquest-3d (private); cron 20:00 UTC
local_sync: run_daily.cmd pulls before + pushes after every run (single ledger for dedupe)
